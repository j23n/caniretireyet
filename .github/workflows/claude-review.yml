# Claude reviews every pull request that isn't a draft and posts its findings as
# comments; its allowed tools can't edit files or push. It runs on Linux minutes.
# Needs the Claude GitHub App on the repository and the CLAUDE_CODE_OAUTH_TOKEN
# secret (from `claude setup-token`), the same one the claude workflow uses.
name: Claude review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  issues: write # creates the ci:mac and ci:screenshots labels
  pull-requests: write
  id-token: write

# A newer push cancels the review in progress, which would review an outdated commit.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # The labels that start the Mac's CI and the UI tests on this pull request (j23n/apple-ci's
      # README, "When CI runs"); the review adds them. Created here when the repository doesn't have
      # them yet.
      - name: The ci:mac and ci:screenshots labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create "ci:mac" --repo "$GITHUB_REPOSITORY" --color 1d76db \
            --description "Runs the Mac's CI on this pull request" 2>/dev/null || true
          gh label create "ci:screenshots" --repo "$GITHUB_REPOSITORY" --color 5319e7 \
            --description "Runs the UI tests and their screenshots on this pull request" 2>/dev/null || true
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            PR TITLE: ${{ github.event.pull_request.title }}
            HEAD: ${{ github.event.pull_request.head.sha }}

            Review this pull request for the Can I Retire Yet repo. Read CLAUDE.md and docs/PLAN.md first, then the diff
            (gh pr diff ${{ github.event.pull_request.number }}) and the docs it touches or relies on.
            Check: correctness bugs, with the inputs that trigger them; CLAUDE.md's rules (module dependencies only as its table
            says, Apple-only frameworks only in CloudSync and App/, no third-party dependencies in the library modules, Decimal
            money never passed through Double outside Planner, open enums instead of Swift enums for stored values, Model's
            public API changes as its contract allows); a file-format change updates its JSON Schema in docs/schema,
            the example library and the round-trip tests; tests would fail if the behaviour broke; made-up data only.

            Post inline comments for specific lines, then one summary comment with gh pr comment. Its first line is
            "Reviewed <the head commit's short SHA>", then a verdict (pass/fail) and numbered findings, each with file:line,
            the problem and a concrete fix, marked:
            - [blocking]: a bug a realistic input triggers in behavior the docs or the description define, or a broken
              CLAUDE.md rule. Name the input.
            - [question]: a case the docs don't decide. Give the options; the owner decides. Don't invent the rule.
            - [minor]: anything else worth changing.
            Only [blocking] findings make the verdict fail. Do not modify files.

            If you reviewed this pull request before (your summaries are in gh pr view ${{ github.event.pull_request.number }} --comments), this is a
            re-review: check that each blocking finding of your latest summary is fixed, and review what changed since
            (git diff <the SHA your latest summary names> ${{ github.event.pull_request.head.sha }}; review the whole diff if that commit is gone). Raise a
            new blocking finding only for a bug those changes introduced, or a clear bug every earlier review missed, not
            a new edge case of logic you've already passed. When a feature has had blocking findings in three reviews,
            report its further edge cases as [question]s: it needs the owner's decision, not another patch.

            The Mac's CI (the app built and tested in Xcode) doesn't run on a pull request by itself. When your verdict is
            pass and the diff touches anything only the Mac builds (the app's or its extensions' Swift, project.yml,
            .xcconfig files, entitlements, Info.plists, assets, the app's tests, or Apple-only code in a package), start it
            once: gh pr edit ${{ github.event.pull_request.number }} --remove-label ci:mac, then
            gh pr edit ${{ github.event.pull_request.number }} --add-label ci:mac. Don't for docs, workflows or Linux-only
            code, which Linux CI covers. Say in your summary whether you started it, and why.

            The UI tests and their screenshots (CI's screenshots job: App/UITests, make screenshots) don't run by
            themselves either, not even on main. When your verdict is pass and the diff changes what a screen shows or how
            it opens (the app's views, layouts, navigation, words, colors, assets, App/UITests, or what the screens show from
            Planner, Tracker or Glance), start them once the same way with the ci:screenshots label: --remove-label, then
            --add-label. Don't for changes no screen shows. Say in your summary whether you started them, and why.
          claude_args: >-
            --model claude-opus-5-5
            --effort high
            --max-turns 60
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),Bash(gh pr edit:*),Read,Grep,Glob"
