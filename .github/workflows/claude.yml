# Claude answers @claude in issues, pull requests and reviews: it reads the
# request, replies in a comment, and can push commits and open a pull request
# for what it was asked. Only people with write access to the repository can
# trigger it. Feedback approved in j23n/feedback arrives as an issue with the
# owner's @claude comment, so Claude starts on it straight away.
# Needs the Claude GitHub App on the repository and the CLAUDE_CODE_OAUTH_TOKEN
# secret (from `claude setup-token`). Comment-triggered runs use the copy of
# this file on the default branch.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Comments without @claude start no runner.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # lets Claude read CI results on pull requests
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # --model and --effort (low, medium, high, xhigh or max) are set to their defaults here,
          # to change in one place. `gh pr create` lets Claude open the pull request itself; the
          # action's own tools (reading, editing, committing, pushing) stay as they are.
          claude_args: >-
            --model claude-opus-5-5
            --effort medium
            --allowedTools "Bash(gh pr create:*)"
