# The shared Linux and macOS jobs (j23n/apple-ci), which run `make ci-linux` and `make ci-macos`,
# and the screenshots of each screen (`make screenshots`, App/README.md "Screenshots"), kept as the
# `screenshots` artifact.
name: CI

# apple-ci's workflows decide when each job runs (its README's "When CI runs"): Linux on every push;
# macOS on pushes to main, runs by hand (Actions › CI › Run workflow), and a pull request once it's
# labeled ci:mac, which Claude's review adds when the change needs the Mac's build. The screenshots
# are taken only when someone asks: by hand with "Take screenshots" ticked, or on a pull request they
# label ci:screenshots.
on:
  push:
  pull_request:
    # Only labeled: each commit already has its push's run. The ci:mac label's run adds the Mac's
    # jobs, ci:screenshots the screenshots; another label's run skips them (apple-ci's README, "When
    # CI runs").
    types: [labeled]
  workflow_dispatch:
    inputs:
      screenshots:
        description: Take screenshots (about half an hour on the Mac)
        type: boolean
        default: false

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run in progress.
concurrency:
  # A label's run has a group of its own, so labeling a pull request for another reason doesn't cancel
  # the Mac's run.
  group: ci-${{ github.ref }}-${{ github.event.label.name }}
  cancel-in-progress: true

jobs:
  linux:
    uses: j23n/apple-ci/.github/workflows/linux.yml@main
    with:
      name: Linux · swift build and test

  # On a pull request the app's builds and tests (make ci-macos-app): Linux has tested the package on
  # the same commit. On main, and by hand, CloudSync's Apple-only tests too (make ci-macos).
  macos:
    uses: j23n/apple-ci/.github/workflows/macos.yml@main
    with:
      name: macOS · package and app (iOS Simulator and Mac)
      run: ${{ github.event_name == 'pull_request' && 'make ci-macos-app' || 'make ci-macos' }}

  # Only when asked: by hand with the screenshots input, or on a pull request once it's labeled
  # ci:screenshots. Not on pushes, main's included, and the review never adds the label.
  screenshots:
    if: github.event_name == 'pull_request' || inputs.screenshots
    uses: j23n/apple-ci/.github/workflows/macos.yml@main
    with:
      name: macOS · screenshots (Mac and iPhone Simulator)
      run: make screenshots
      artifact-name: screenshots
      artifact-path: .build/screenshots
      pull-request-label: ci:screenshots
