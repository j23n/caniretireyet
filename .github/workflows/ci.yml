# The shared Linux and macOS jobs (j23n/apple-ci), which run `make ci-linux` and `make ci-macos`,
# and the UI tests with their screenshots (`make screenshots`, App/README.md "UI tests and
# screenshots"), kept as the `screenshots` artifact.
name: CI

# apple-ci's workflows run each job once per commit: Linux on every push, macOS on pull requests,
# pushes to main and runs by hand (Actions › CI › Run workflow), as its README's "When CI runs" says.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    uses: j23n/apple-ci/.github/workflows/linux.yml@main
    with:
      name: Linux · swift build and test

  macos:
    uses: j23n/apple-ci/.github/workflows/macos.yml@main
    with:
      name: macOS · package and app (iOS Simulator and Mac)

  screenshots:
    uses: j23n/apple-ci/.github/workflows/macos.yml@main
    with:
      name: macOS · UI tests and screenshots (Mac and iPhone Simulator)
      run: make screenshots
      ui-automation: true
      artifact-name: screenshots
      artifact-path: .build/screenshots
