# XcodeGen spec for the Can I Retire Yet? app (iPhone, iPad and Mac), at the
# repository's root, so `xcodegen` here (or `make project`) writes the project:
#
#   brew install xcodegen
#   xcodegen
#   open CanIRetireYet.xcodeproj
#
# The generated project is not committed; edit this file instead. The app's
# files are in App/; the Swift package it links is the repository itself.
#
# ┌──────────────────────────────────────────────────────────────────────────┐
# │ BEFORE YOU RUN IT ON YOUR OWN DEVICES:                                     │
# │ 1. Put your Apple Developer team ID in Signing.xcconfig at the root (git   │
# │    ignores it; make signing TEAM=ABCDE12345 writes it). The bundle id is   │
# │    j23n's, com.j23n.caniretireyet; under another team, put your own there  │
# │    too:                                                                    │
# │      APP_BUNDLE_IDENTIFIER = com.<yourdomain>.caniretireyet                │
# │    The iCloud container (iCloud.<bundle id>), the widgets' bundle id       │
# │    (<bundle id>.widgets) and the App Group they share with the app         │
# │    (group.<bundle id>) follow the bundle id.                               │
# │ 2. Generate the project again.                                             │
# │ 3. In Xcode, Signing & Capabilities: check that iCloud → iCloud Documents  │
# │    lists the container iCloud.<bundle id>, and that App Groups lists       │
# │    group.<bundle id> for both the app and CanIRetireYetWidgets.            │
# └──────────────────────────────────────────────────────────────────────────┘

name: CanIRetireYet

options:
  bundleIdPrefix: com.j23n
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"

# DEVELOPMENT_TEAM and APP_BUNDLE_IDENTIFIER: App/Config/Project.xcconfig, which
# reads yours from Signing.xcconfig at the root.
configFiles:
  Debug: App/Config/Project.xcconfig
  Release: App/Config/Project.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # Shared by the app and its widgets: the app writes the widgets' snapshot
    # into the group's container (App/Shared/AppGroup.swift).
    APP_GROUP_IDENTIFIER: group.$(APP_BUNDLE_IDENTIFIER)

# The Swift package at the repository root, next to this file: every module
# except the CLI.
packages:
  CanIRetireYetKit:
    path: .
  # In-app feedback (App/README.md, "Feedback"), compiled in only with the FEEDBACK
  # condition (Debug builds, below). Pinned to a commit of j23n/feedbackkit.
  FeedbackKit:
    url: https://github.com/j23n/feedbackkit
    revision: 47902b322188462f383aafab00494d66de59e48c

targets:
  CanIRetireYet:
    type: application
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App/Sources
      # Shared with the widgets: the App Group.
      - path: App/Shared
      # Assets.xcassets: the design system's colours (light and dark), see
      # App/Sources/DesignSystem/Palette.swift.
      - path: App/Resources
      # The tests' made-up example library, a folder in the app's bundle:
      # the previews' and UI tests' library (App/Sources/Preview/PreviewLibrary.swift).
      - path: Sources/TestSupport/Resources/ExampleLibrary
        type: folder
        buildPhase: resources
    # The build number: the number of commits, set when the bundle is built
    # (j23n/apple-ci README.md, "Build numbers"). The script reads .git, hence
    # ENABLE_USER_SCRIPT_SANDBOXING: NO below.
    postBuildScripts:
      - name: Build number
        script: '"$SRCROOT/.apple-ci/build-number.sh"'
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_IDENTIFIER)
        PRODUCT_NAME: CanIRetireYet
        MARKETING_VERSION: "0.1.0"
        # The build number of a built app is the number of commits (postBuildScripts);
        # this is what a build without git history keeps.
        CURRENT_PROJECT_VERSION: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        # Colours are looked up by name (Palette.swift); no generated symbols.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: NO
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
        # The icon set in Assets.xcassets, made from the SVGs in App/Design/AppIcon.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Info.plist: the keys in App/Config/Info.plist (iCloud Drive folder) plus generated ones.
        INFOPLIST_FILE: App/Config/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Can I Retire Yet?"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        # Every orientation on both, as Xcode 26 requires of an app that
        # doesn't require full screen: on iPad the app takes part in Split
        # View, Slide Over and Stage Manager (it switches to the sidebar
        # layout when it has the room, UI.md "Navigation"); iPhones without a
        # Home button never use upside down.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # iCloud Documents on both platforms; the Mac also gets the app sandbox.
        CODE_SIGN_ENTITLEMENTS: App/Config/CanIRetireYet.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": App/Config/CanIRetireYet-macOS.entitlements
        "ENABLE_HARDENED_RUNTIME[sdk=macosx*]": YES
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
      configs:
        # In-app feedback in the builds you run from Xcode, never in an archive.
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) FEEDBACK
    dependencies:
      - package: CanIRetireYetKit
        product: Model
      - package: CanIRetireYetKit
        product: Tracker
      - package: CanIRetireYetKit
        product: Storage
      - package: CanIRetireYetKit
        product: Importer
      - package: CanIRetireYetKit
        product: Prices
      - package: CanIRetireYetKit
        product: Planner
      - package: CanIRetireYetKit
        product: CloudSync
      - package: CanIRetireYetKit
        product: Glance
      - package: FeedbackKit
        product: FeedbackKit
      # The widgets, embedded in the app.
      - target: CanIRetireYetWidgets

  # The widgets (UI.md, "Widgets"): a WidgetKit extension that draws the
  # snapshot the app writes into the App Group, and never opens the library.
  CanIRetireYetWidgets:
    type: app-extension
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App/Widgets
      - path: App/Shared
      # Amounts and dates read as in the app, in its colours.
      - path: App/Sources/DesignSystem/AmountFormat.swift
      - path: App/Sources/DesignSystem/Palette.swift
      # The design system's colour sets (light and dark), looked up by name.
      - path: App/Resources/Assets.xcassets
    # The build number: the number of commits, set when the bundle is built
    # (j23n/apple-ci README.md, "Build numbers"). The script reads .git, hence
    # ENABLE_USER_SCRIPT_SANDBOXING: NO below.
    postBuildScripts:
      - name: Build number
        script: '"$SRCROOT/.apple-ci/build-number.sh"'
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_IDENTIFIER).widgets
        PRODUCT_NAME: CanIRetireYetWidgets
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: SurfaceCard
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: NO
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
        # Info.plist: the extension point and the App Group, plus generated keys.
        INFOPLIST_FILE: App/Config/Widgets-Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Can I Retire Yet?"
        # The App Group on both platforms; the Mac also gets the sandbox.
        CODE_SIGN_ENTITLEMENTS: App/Config/CanIRetireYetWidgets.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": App/Config/CanIRetireYetWidgets-macOS.entitlements
        "ENABLE_HARDENED_RUNTIME[sdk=macosx*]": YES
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    dependencies:
      - package: CanIRetireYetKit
        product: Model
      - package: CanIRetireYetKit
        product: Glance

  # Opens each screen with a made-up library and keeps a screenshot of it
  # (App/UITests; CI's "UI tests and screenshots" job).
  CanIRetireYetUITests:
    type: bundle.ui-testing
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App/UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_IDENTIFIER).uitests
        TEST_TARGET_NAME: CanIRetireYet
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: CanIRetireYet

schemes:
  CanIRetireYet:
    build:
      targets:
        CanIRetireYet: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CanIRetireYetUITests
    archive:
      config: Release
