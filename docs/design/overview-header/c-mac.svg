<svg xmlns="http://www.w3.org/2000/svg" width="1264" height="892" viewBox="0 0 1264 892">
<title>Overview header, direction C (One gauge), on the Mac</title>
<!-- A mock, not a screenshot: the app's colors (App/Resources/Assets.xcassets), its spacing (Metrics) and the macOS text styles at the default size. Made-up values from UI.md. -->
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif; }
.light { --page: #F4F4F1; --card: #FCFCFB; --border: #E1E0D9; --ink: #0B0B0B; --ink2: #52514E; --ink3: #898781; --accent: #2A78D6; --tint: rgba(42, 120, 214, 0.14);
  --up: #006300; --behind: #D95926; --grid: #E1E0D9; --axis: #C3C2B7; --track: rgba(120, 120, 128, 0.18); --range: rgba(11, 11, 11, 0.18);
  --cash: #2A78D6; --bonds: #EB6834; --equity: #1BAF7A; --gold: #EDA100; --cashS: #2A78D6; --bondsS: #D95926; --equityS: #199E70; --goldS: #BA7E07;
  --glass: rgba(252, 252, 251, 0.9); --edge: rgba(0, 0, 0, 0.10); --sidebar: rgba(234, 234, 230, 0.94); --switch: rgba(120, 120, 128, 0.16); }
.page { fill: var(--page); } .card { fill: var(--card); stroke: var(--border); stroke-width: 1; }
.ink { fill: var(--ink); } .ink2 { fill: var(--ink2); } .ink3 { fill: var(--ink3); }
.accent { fill: var(--accent); } .tint { fill: var(--tint); } .up { fill: var(--up); } .behind { fill: var(--behind); }
.track { fill: var(--track); } .range { fill: var(--range); } .glass { fill: var(--glass); stroke: var(--edge); stroke-width: 0.5; }
.sidebar { fill: var(--sidebar); stroke: var(--edge); stroke-width: 0.5; } .switch { fill: var(--switch); }
.c-ink { color: var(--ink); } .c-ink3 { color: var(--ink3); } .c-accent { color: var(--accent); }
.s-grid { stroke: var(--grid); } .s-axis { stroke: var(--axis); } .s-ink2 { stroke: var(--ink2); } .s-edge { stroke: var(--edge); }
.f-cash { fill: var(--cash); fill-opacity: 0.3; } .f-bonds { fill: var(--bonds); fill-opacity: 0.3; }
.f-equity { fill: var(--equity); fill-opacity: 0.3; } .f-gold { fill: var(--gold); fill-opacity: 0.3; }
.d-cash { fill: var(--cashS); } .d-bonds { fill: var(--bondsS); } .d-equity { fill: var(--equityS); } .d-gold { fill: var(--goldS); }
.e-cash { stroke: var(--cashS); } .e-bonds { stroke: var(--bondsS); } .e-equity { stroke: var(--equityS); } .e-total { stroke: var(--ink); }
.largeTitle { font-size: 26px; font-weight: 700; }
.title { font-size: 22px; }
.title2 { font-size: 17px; }
.title3 { font-size: 15px; }
.body { font-size: 13px; }
.btn { font-size: 12px; }
.sub { font-size: 11px; }
.cap { font-size: 10px; }
.head { font-size: 11px; font-weight: 600; }
.sb { font-weight: 600; } .b { font-weight: 700; }
.label { font-size: 15px; font-weight: 600; fill: #52514E; letter-spacing: -0.2px; }
.note { font-weight: 400; fill: #898781; }
</style>
<defs>
  <clipPath id="window"><rect width="1200" height="800" rx="16"/></clipPath>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.2"/></filter>
  <filter id="float" x="-20%" y="-40%" width="140%" height="200%"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000" flood-opacity="0.08"/></filter>
  <filter id="knob" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.2"/></filter>

  <!-- SF Symbols, approximated -->
  <symbol id="i-chevron" viewBox="0 0 7 12"><path d="M1.2 1.2 5.8 6l-4.6 4.8" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-info" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8.7" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="10" cy="6.1" r="1.2" fill="currentColor"/><path d="M10 9.1v5.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M1.8 12S5.5 5.2 12 5.2 22.2 12 22.2 12 18.5 18.8 12 18.8 1.8 12 1.8 12z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><circle cx="12" cy="12" r="3.4" fill="currentColor"/></symbol>
  <symbol id="i-trend" viewBox="0 0 24 24"><path d="M3 3.5V20.5H21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M6.5 15.5 10.5 11l3 3 6-6.5M15.8 7.2h3.9v3.9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-pie" viewBox="0 0 24 24"><path d="M11 4.2A8.3 8.3 0 1 0 19.8 13H11z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M13.6 2.6v8h8a8 8 0 0 0-8-8z" fill="currentColor"/></symbol>
  <symbol id="i-checklist" viewBox="0 0 24 24"><path d="M3 6.5l2 2 3.5-4M3 15.5l2 2 3.5-4" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 7h9M12 16h9" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M7 10H5v10h14V10h-2M12 3v11M8.5 10.5 12 14l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-tag" viewBox="0 0 24 24"><path d="M3 12.5V4h8.5l9 9-8.5 8.5z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><circle cx="8" cy="9" r="1.4" fill="currentColor"/></symbol>
  <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7 18.5h10.5a4 4 0 0 0 .3-8A5.6 5.6 0 0 0 6.9 9.4 4.6 4.6 0 0 0 7 18.5z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></symbol>
  <symbol id="i-disclosure" viewBox="0 0 10 10"><path d="M3 1.5 7 5l-4 3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-updown" viewBox="0 0 6 10"><path d="M1 3.6 3 1.6l2 2M1 6.4l2 2 2-2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>

  <!-- The window around the page: sidebar and toolbar -->
  <g id="chrome">
    <rect width="1200" height="800" class="page"/>
    <rect x="8" y="8" width="232" height="784" rx="12" class="sidebar" filter="url(#float)"/>
    <circle cx="26" cy="26" r="6" fill="#FF5F57"/><circle cx="46" cy="26" r="6" fill="#FEBC2E"/><circle cx="66" cy="26" r="6" fill="#28C840"/>
    <rect x="18" y="50" width="212" height="28" rx="8" class="tint"/>
    <use href="#i-trend" x="26" y="56" width="16" height="16" class="c-accent"/><text x="50" y="68.5" class="body ink">Overview</text>
    <use href="#i-checklist" x="26" y="84" width="16" height="16" class="c-accent"/><text x="50" y="96.5" class="body ink">Check-in</text>
    <circle cx="218" cy="92" r="3" class="accent"/>
    <text x="26" y="132" class="head ink3">Accounts</text><text x="222" y="132" text-anchor="end" class="body ink2">312.480</text>
    <use href="#i-disclosure" x="27" y="146.5" width="9" height="9" class="c-ink3"/><text x="42" y="155.5" class="body ink">Cash</text><text x="222" y="155.5" text-anchor="end" class="body ink2">12.990</text>
    <use href="#i-disclosure" x="27" y="174.5" width="9" height="9" class="c-ink3"/><text x="42" y="183.5" class="body ink">Investments</text><text x="222" y="183.5" text-anchor="end" class="body ink2">171.300</text>
    <use href="#i-disclosure" x="27" y="202.5" width="9" height="9" class="c-ink3"/><text x="42" y="211.5" class="body ink">Crypto &amp; gold</text><text x="222" y="211.5" text-anchor="end" class="body ink2">13.040</text>
    <use href="#i-disclosure" x="27" y="230.5" width="9" height="9" class="c-ink3"/><text x="42" y="239.5" class="body ink">Pension</text><text x="222" y="239.5" text-anchor="end" class="body ink2">115.150</text>
    <text x="26" y="274" class="head ink3">Plans</text>
    <use href="#i-pie" x="26" y="285" width="16" height="16" class="c-accent"/><text x="50" y="297.5" class="body ink">Base case</text>
    <use href="#i-pie" x="26" y="313" width="16" height="16" class="c-accent"/><text x="50" y="325.5" class="body ink">Part-time from 50</text>
    <text x="26" y="360" class="head ink3">Library</text>
    <use href="#i-download" x="26" y="371" width="16" height="16" class="c-accent"/><text x="50" y="383.5" class="body ink">Import…</text>
    <use href="#i-tag" x="26" y="399" width="16" height="16" class="c-accent"/><text x="50" y="411.5" class="body ink">Instruments</text>
    <use href="#i-cloud" x="26" y="427" width="16" height="16" class="c-accent"/><text x="50" y="439.5" class="body ink">Sync &amp; backups</text>
    <text x="268" y="31" class="title3 b ink">Overview</text>
    <rect x="1048" y="9" width="138" height="34" rx="17" class="glass" filter="url(#float)"/>
    <use href="#i-checklist" x="1060" y="18.5" width="15" height="15" class="c-ink"/><text x="1081" y="30.5" class="body ink">Check In</text>
    <line x1="1148" x2="1148" y1="17" y2="35" class="s-edge"/>
    <use href="#i-eye" x="1157" y="17.5" width="17" height="17" class="c-ink"/>
  </g>

  <!-- The history chart, unchanged in every direction, and the top of the first card under it -->
  <g id="history">
    <rect x="360" y="0" width="42" height="22" rx="6" class="tint"/>
    <text x="369" y="15.5" class="btn sb accent">3Y</text>
    <use href="#i-updown" x="387" y="6.5" width="5.4" height="9" class="c-accent"/>
    <text x="1048" y="15" text-anchor="end" class="sub ink">Future</text>
    <rect x="1056" y="2" width="32" height="18" rx="9" class="switch"/>
    <circle cx="1065" cy="11" r="7" fill="#FFFFFF" filter="url(#knob)"/>
    <circle cx="364" cy="38.5" r="3.5" class="d-cash"/><text x="372" y="42" class="cap ink2">Cash</text>
    <circle cx="410" cy="38.5" r="3.5" class="d-bonds"/><text x="418" y="42" class="cap ink2">Bonds</text>
    <circle cx="459" cy="38.5" r="3.5" class="d-equity"/><text x="467" y="42" class="cap ink2">Equity</text>
    <circle cx="510" cy="38.5" r="3.5" class="d-gold"/><text x="518" y="42" class="cap ink2">Gold</text>
    <g class="s-grid" stroke-width="0.5">
      <line x1="360" x2="1057" y1="251.71" y2="251.71"/><line x1="360" x2="1057" y1="173.43" y2="173.43"/><line x1="360" x2="1057" y1="95.14" y2="95.14"/>
      <line x1="418.08" x2="418.08" y1="56" y2="330"/><line x1="650.42" x2="650.42" y1="56" y2="330"/><line x1="882.75" x2="882.75" y1="56" y2="330"/>
    </g>
    <line x1="360" x2="1057" y1="330" y2="330" class="s-axis"/>
    <text x="1063" y="333.5" class="cap ink3">0</text><text x="1063" y="255.2" class="cap ink3">100k</text>
    <text x="1063" y="176.9" class="cap ink3">200k</text><text x="1063" y="98.6" class="cap ink3">300k</text>
    <text x="421.08" y="345" class="cap ink3">2024</text><text x="653.42" y="345" class="cap ink3">2025</text><text x="885.75" y="345" class="cap ink3">2026</text>
    <g transform="translate(360 330) scale(19.361 -0.78286)">
      <polygon class="f-cash" points="0,11 3,11.5 6,12 9,11.8 12,12.2 15,12.5 18,12.4 21,12.6 24,12.8 27,12.7 30,12.9 33,13 36,13 36,0 0,0"/>
      <polygon class="f-bonds" points="0,53 3,54 6,55.5 9,55 12,56.5 15,57.5 18,57 21,58.5 24,59.5 27,60 30,61.5 33,62.5 36,63.2 36,13 33,13 30,12.9 27,12.7 24,12.8 21,12.6 18,12.4 15,12.5 12,12.2 9,11.8 6,12 3,11.5 0,11"/>
      <polygon class="f-equity" points="0,203 3,210 6,222 9,228 12,236 15,252 18,238 21,255 24,266 27,274 30,285 33,292 36,299 36,63.2 33,62.5 30,61.5 27,60 24,59.5 21,58.5 18,57 15,57.5 12,56.5 9,55 6,55.5 3,54 0,53"/>
      <polygon class="f-gold" points="0,211.5 3,219 6,231.5 9,238 12,246.5 15,263 18,249 21,266.5 24,278 27,286.5 30,298 33,305 36,312.5 36,299 33,292 30,285 27,274 24,266 21,255 18,238 15,252 12,236 9,228 6,222 3,210 0,203"/>
      <g fill="none" stroke-width="1">
        <polyline class="e-cash" vector-effect="non-scaling-stroke" points="0,11 3,11.5 6,12 9,11.8 12,12.2 15,12.5 18,12.4 21,12.6 24,12.8 27,12.7 30,12.9 33,13 36,13"/>
        <polyline class="e-bonds" vector-effect="non-scaling-stroke" points="0,53 3,54 6,55.5 9,55 12,56.5 15,57.5 18,57 21,58.5 24,59.5 27,60 30,61.5 33,62.5 36,63.2"/>
        <polyline class="e-equity" vector-effect="non-scaling-stroke" points="0,203 3,210 6,222 9,228 12,236 15,252 18,238 21,255 24,266 27,274 30,285 33,292 36,299"/>
      </g>
      <polyline class="e-total" fill="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke" points="0,211.5 3,219 6,231.5 9,238 12,246.5 15,263 18,249 21,266.5 24,278 27,286.5 30,298 33,305 36,312.5"/>
    </g>
    <rect x="360.5" y="366.5" width="727" height="300" rx="16" class="card"/>
    <text x="376" y="395" class="body b ink">What moved in September</text>
  </g>
</defs>

<rect width="1264" height="892" fill="#FFFFFF"/>
<text x="40" y="44" class="label">C. One gauge <tspan class="note">· Mac: the answer and net worth side by side, the gauge across the page</tspan></text>

<g transform="translate(32 60)">
  <rect width="1200" height="800" rx="16" fill="#F4F4F1" filter="url(#shadow)"/>
  <g clip-path="url(#window)" class="light">
    <use href="#chrome"/>

    <!-- The answer, on the left -->
    <text x="360" y="72.5" class="sub ink2">Can I retire yet?</text>
    <use href="#i-chevron" x="792" y="64" width="5.8" height="10" class="c-ink3"/>
    <text x="360" y="96.5" class="title2 b ink">Not yet · earliest at 54</text>
    <text x="360" y="114.5" class="sub ink2">About 15 years · in 9 of 10 futures</text>

    <!-- Net worth, on the right at the same height -->
    <text x="838" y="72.5" class="sub ink2">Net worth</text>
    <text x="838" y="102" class="title b ink">312.480 €</text>
    <text x="838" y="122.5" class="sub"><tspan class="up">▲ 4.210 € </tspan><tspan class="ink2">in September</tspan></text>
    <text x="838" y="138.5" class="sub"><tspan class="up">▲ 6,2% </tspan><tspan class="ink2">this year</tspan></text>

    <!-- The gauge, across the page: the bar is the readiness; the darker
         stretch of its track and the bracket under it are the baseline's
         25–75% futures for today, converted to readiness -->
    <text x="360" y="170.5" class="sub ink">58% of what retiring today needs</text>
    <use href="#i-info" x="1075" y="162.5" width="13" height="13" class="c-accent"/>
    <rect x="360" y="182" width="728" height="8" rx="4" class="track"/>
    <rect x="731.28" y="182" width="94.64" height="8" class="range"/>
    <rect x="360" y="182" width="422.24" height="8" rx="4" class="accent"/>
    <path d="M732.03 193v4a2 2 0 0 0 2 2h89.14a2 2 0 0 0 2-2v-4" fill="none" class="s-ink2" stroke-width="1.5"/>
    <text x="778.6" y="211" text-anchor="middle" class="cap ink2">Jan baseline</text>
    <text x="1088" y="211" text-anchor="end" class="sub sb up">On plan</text>
    <text x="360" y="228.5" class="sub ink2">Past the coast point: 63 without saving</text>

    <use href="#history" y="256"/>
  </g>
  <rect x="0.25" y="0.25" width="1199.5" height="799.5" rx="15.75" fill="none" stroke="#000" stroke-opacity="0.22" stroke-width="0.5"/>
</g>
</svg>
