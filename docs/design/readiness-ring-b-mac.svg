<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1000" viewBox="0 0 1280 1000">
  <title>Sketch B, the readiness ring with the answer, on the Mac: the ring at the left of the content area, the tiles at its right</title>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .ti { font-size: 28px; font-weight: 700; }
    .qt { font-size: 22px; font-weight: 700; }
    .hd { font-size: 17px; font-weight: 600; }
    .wt { font-size: 15px; font-weight: 700; }
    .sh { font-size: 15px; }
    .sd { font-size: 13px; }
    .sdh { font-size: 11px; font-weight: 600; }
    .sb { font-weight: 600; }
    .mid { text-anchor: middle; }
    .end { text-anchor: end; }
    .sheet { fill: #E8E7E2; }
    .ink { fill: #0B0B0B; }
    .sec { fill: #52514E; }
    .mut { fill: #898781; }
    .acc { fill: #2A78D6; }
    .accf { fill: #2A78D6; fill-opacity: 0.14; }
    .up { fill: #006300; }
    .page { fill: #F4F4F1; }
    .cardf { fill: #FCFCFB; }
    .side { fill: #FAFAF8; fill-opacity: 0.94; stroke: #E1E0D9; }
    .glass { fill: #FFFFFF; fill-opacity: 0.86; stroke: #E1E0D9; }
    .tog { fill: #E3E3E0; }
    .knob { fill: #FFFFFF; }
    .red { fill: #FF5F57; }
    .yellow { fill: #FEBC2E; }
    .green { fill: #28C840; }
    .s-ink { stroke: #0B0B0B; }
    .s-sec { stroke: #52514E; }
    .s-mut { stroke: #898781; }
    .s-acc { stroke: #2A78D6; }
    .s-grid { stroke: #E1E0D9; }
    .s-border { stroke: #E1E0D9; }
    .s-zero { stroke: #898781; stroke-opacity: 0.6; }
    .s-window { stroke: #CFCEC8; }
    .sw-blue { fill: #2A78D6; }
    .sw-aqua { fill: #199E70; }
    .sw-green { fill: #008300; }
    .sw-red { fill: #E34948; }
    .fa-blue { fill: #2A78D6; fill-opacity: 0.16; }
    .fa-aqua { fill: #1BAF7A; fill-opacity: 0.18; }
    .fa-green { fill: #008300; fill-opacity: 0.14; }
    .fa-red { fill: #E34948; fill-opacity: 0.14; }
    .ln-blue { stroke: #2A78D6; }
    .ln-aqua { stroke: #199E70; }
    .ln-green { stroke: #008300; }
    .ln-red { stroke: #E34948; }
  </style>

  <defs>
    <filter id="shadow" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
    <filter id="window-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
    <clipPath id="window">
      <rect width="1200" height="800" rx="14"/>
    </clipPath>

    <path id="chev" d="M-2.5 -5 L2.5 0 L-2.5 5" fill="none" class="s-mut" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <g id="clock">
      <circle r="6" fill="none" class="s-sec" stroke-width="1.5"/>
      <path d="M0 -3.4 V0 H2.6" fill="none" class="s-sec" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="info">
      <circle r="8.5" fill="none" class="s-acc" stroke-width="1.5"/>
      <circle cy="-3.9" r="1.15" class="acc"/>
      <rect x="-0.85" y="-1.3" width="1.7" height="6.6" rx="0.85" class="acc"/>
    </g>
    <g id="eye">
      <path d="M-10 0 C-7 -6.4 7 -6.4 10 0 C7 6.4 -7 6.4 -10 0 Z" fill="none" class="s-ink" stroke-width="1.6" stroke-linejoin="round"/>
      <circle r="3.1" class="ink"/>
    </g>
    <g id="gear">
      <circle r="8" fill="none" class="s-ink" stroke-width="3" stroke-dasharray="3.1 3.183"/>
      <circle r="6.2" fill="none" class="s-ink" stroke-width="2.2"/>
      <circle r="2.2" fill="none" class="s-ink" stroke-width="1.5"/>
    </g>
  </defs>

  <rect width="1280" height="1000" class="sheet"/>
  <text x="40" y="62" class="ink" style="font-size: 30px; font-weight: 700;">Sketch B on the Mac and iPad</text>
  <text x="40" y="92" class="sec" style="font-size: 17px;">The ring stays 200 points across, at the left of the content area; the tiles stand at its right, as tall as the ring.</text>

  <g transform="translate(40 120)">
    <rect width="1200" height="800" rx="14" class="page" filter="url(#window-shadow)"/>
    <g clip-path="url(#window)">
      <rect width="1200" height="800" class="page"/>

      <!-- Toolbar -->
      <text x="276" y="36" class="wt ink">Overview</text>
      <rect x="1104" y="12" width="84" height="36" rx="18" class="glass" filter="url(#shadow)"/>
      <use href="#eye" x="1126" y="30"/>
      <use href="#gear" x="1166" y="30"/>

      <!-- Sidebar -->
      <rect x="8" y="8" width="244" height="784" rx="16" class="side" filter="url(#shadow)"/>
      <circle cx="28" cy="30" r="6" class="red"/>
      <circle cx="48" cy="30" r="6" class="yellow"/>
      <circle cx="68" cy="30" r="6" class="green"/>
      <rect x="18" y="58" width="224" height="26" rx="7" class="accf"/>
      <text x="30" y="75" class="sd ink sb">Overview</text>
      <text x="30" y="101" class="sd ink">Check-in</text>
      <text x="30" y="127" class="sd ink">Accounts</text>
      <text x="232" y="127" class="sd sec end">97.330</text>
      <text x="34" y="153" class="sd mut">▸</text>
      <text x="48" y="153" class="sd ink">Cash</text>
      <text x="232" y="153" class="sd sec end">12.990</text>
      <text x="34" y="179" class="sd mut">▸</text>
      <text x="48" y="179" class="sd ink">Investments</text>
      <text x="232" y="179" class="sd sec end">71.300</text>
      <text x="34" y="205" class="sd mut">▸</text>
      <text x="48" y="205" class="sd ink">Crypto &amp; gold</text>
      <text x="232" y="205" class="sd sec end">13.040</text>
      <text x="34" y="231" class="sd mut">▸</text>
      <text x="48" y="231" class="sd ink">Pension · Property · Debts</text>
      <text x="34" y="257" class="sd mut">▸</text>
      <text x="48" y="257" class="sd ink">Closed (1)</text>
      <text x="30" y="295" class="sdh mut">Plans</text>
      <text x="30" y="319" class="sd ink">Base case</text>
      <text x="30" y="345" class="sd ink">Part-time from 50</text>
      <text x="30" y="383" class="sdh mut">Library</text>
      <text x="30" y="407" class="sd ink">Import…</text>
      <text x="30" y="433" class="sd ink">Instruments</text>
      <text x="30" y="459" class="sd ink">Sync &amp; backups</text>

      <!-- The answer: the question with its ⓘ, then the ring with the headline and the run status inside -->
      <text x="535" y="86" class="qt ink end">Can I retire yet?</text>
      <use href="#info" x="553" y="78.5"/>
      <circle cx="466" cy="205" r="94" fill="none" class="s-grid" stroke-width="12"/>
      <circle cx="466" cy="205" r="94" fill="none" class="s-acc" stroke-width="12" stroke-linecap="round" stroke-dasharray="342.56 1000" transform="rotate(-90 466 205)"/>
      <text x="466" y="191" class="ti ink mid">In 15 years</text>
      <text x="466" y="218" class="sh mid"><tspan class="ink sb">58%</tspan><tspan class="sec"> ready</tspan></text>
      <use href="#clock" x="441" y="239"/>
      <text x="448" y="244" class="sh sec">30 Sep</text>

      <!-- Tiles: on the Mac and iPad each part of a line is on one row -->
      <g transform="translate(590 105)">
        <rect x="0.5" y="0.5" width="243" height="199" rx="15.5" class="cardf s-border"/>
        <text x="12" y="27" class="sh sec">Net worth</text>
        <text x="12" y="61" class="ti ink">312.480 €</text>
        <text x="12" y="85" class="sh"><tspan class="up">▲ 4.210 €</tspan><tspan class="sec"> in September</tspan></text>
        <text x="12" y="107" class="sh"><tspan class="up">▲ 6,2%</tspan><tspan class="sec"> this year</tspan></text>
      </g>
      <g transform="translate(850 105)">
        <rect x="0.5" y="0.5" width="243" height="199" rx="15.5" class="cardf s-border"/>
        <text x="12" y="27" class="sh sec">On track?</text>
        <use href="#chev" x="229" y="22"/>
        <text x="12" y="61" class="ti up">On plan</text>
        <text x="12" y="85" class="sh"><tspan class="ink">12.400 € ahead</tspan><tspan class="sec"> of January</tspan></text>
        <text x="12" y="107" class="sh ink">Past the coast point: 63</text>
        <text x="12" y="129" class="sh ink">without saving</text>
      </g>

      <!-- History chart -->
      <text x="366" y="370" class="sh sb acc">3Y</text>
      <path d="M389 361.5 L393 365.5 L397 361.5" fill="none" class="s-acc" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="1046" y="370" class="sh ink end">Future</text>
      <rect x="1056" y="354" width="38" height="22" rx="11" class="tog"/>
      <circle cx="1067" cy="365" r="9.5" class="knob" filter="url(#shadow)"/>
      <rect x="366" y="394" width="12" height="4" rx="2" class="sw-blue"/>
      <text x="383" y="400" class="sd sec">Cash</text>
      <rect x="426" y="394" width="12" height="4" rx="2" class="sw-aqua"/>
      <text x="443" y="400" class="sd sec">Equity</text>
      <rect x="496" y="394" width="12" height="4" rx="2" class="sw-green"/>
      <text x="513" y="400" class="sd sec">Real estate</text>
      <rect x="594" y="394" width="12" height="4" rx="2" class="sw-red"/>
      <text x="611" y="400" class="sd sec">Debts</text>
      <g transform="matrix(1.9676 0 0 1.25 334.52 336.5)">
        <path d="M16 90.5 H386 M16 145.5 H386" fill="none" class="s-grid" stroke-width="0.5" vector-effect="non-scaling-stroke"/>
        <path d="M16,200 L16,180 L53,179 L90,180 L127,178 L164,177 L201,176 L238,175 L275,174 L312,174 L349,173 L386,172 L386,200 Z" class="fa-blue"/>
        <path d="M16,180 L53,179 L90,180 L127,178 L164,177 L201,176 L238,175 L275,174 L312,174 L349,173 L386,172" fill="none" class="ln-blue" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
        <path d="M16,178 L53,177 L90,178 L127,176 L164,175 L201,174 L238,173 L275,172 L312,172 L349,171 L386,170 L386,104 L349,110 L312,114 L275,120 L238,128 L201,130 L164,136 L127,140 L90,148 L53,146 L16,150 Z" class="fa-aqua"/>
        <path d="M16,150 L53,146 L90,148 L127,140 L164,136 L201,130 L238,128 L275,120 L312,114 L349,110 L386,104" fill="none" class="ln-aqua" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
        <path d="M16,148 L53,144 L90,146 L127,138 L164,134 L201,128 L238,126 L275,118 L312,112 L349,108 L386,102 L386,78 L349,84 L312,88 L275,94 L238,102 L201,104 L164,110 L127,114 L90,122 L53,120 L16,124 Z" class="fa-green"/>
        <path d="M16,124 L53,120 L90,122 L127,114 L164,110 L201,104 L238,102 L275,94 L312,88 L349,84 L386,78" fill="none" class="ln-green" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
        <path d="M16,202 L386,202 L386,217 L349,218 L312,218 L275,219 L238,219 L201,220 L164,220 L127,221 L90,221 L53,222 L16,222 Z" class="fa-red"/>
        <path d="M16,222 L53,222 L90,221 L127,221 L164,220 L201,220 L238,219 L275,219 L312,218 L349,218 L386,217" fill="none" class="ln-red" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
        <path d="M16 201 H386" fill="none" class="s-zero" stroke-width="1" vector-effect="non-scaling-stroke"/>
      </g>

      <!-- What moved in September, running off the window's bottom -->
      <rect x="366.5" y="646.5" width="727" height="199" rx="15.5" class="cardf s-border"/>
      <text x="382" y="676" class="hd ink">What moved in September</text>
      <text x="382" y="700" class="sh sec">308.270 € → 312.480 €</text>
      <text x="382" y="738" class="sh ink">Markets</text>
      <rect x="560" y="726" width="220" height="14" rx="4" class="up"/>
      <text x="1078" y="738" class="sh ink end">+2.950 €</text>
      <text x="382" y="766" class="sh ink">New money</text>
      <rect x="560" y="754" width="112" height="14" rx="4" class="up"/>
      <text x="1078" y="766" class="sh ink end">+1.500 €</text>
      <path d="M559.5 718 V800" fill="none" class="s-mut" stroke-width="1"/>
    </g>
    <rect x="0.5" y="0.5" width="1199" height="799" rx="13.5" fill="none" class="s-window"/>
  </g>

  <text x="40" y="958" class="sh sec">On an iPad the sidebar and the content area are laid out the same way. The header is as tall as the question and the ring, about 240 points.</text>
</svg>
