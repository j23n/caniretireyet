<svg xmlns="http://www.w3.org/2000/svg" width="1430" height="1110" viewBox="0 0 1430 1110">
  <title>Sketch B, the readiness ring with the answer, on iPhone in light mode: Not yet, Yes lapping, and hidden amounts</title>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .lt { font-size: 34px; font-weight: 700; }
    .ti { font-size: 28px; font-weight: 700; }
    .hd { font-size: 17px; font-weight: 600; }
    .sh { font-size: 15px; }
    .lg { font-size: 13px; }
    .tab { font-size: 10px; font-weight: 600; }
    .sb { font-weight: 600; }
    .mid { text-anchor: middle; }
    .end { text-anchor: end; }
    .sheet { fill: #E8E7E2; }
    .ink { fill: #0B0B0B; }
    .sec { fill: #52514E; }
    .mut { fill: #898781; }
    .acc { fill: #2A78D6; }
    .up { fill: #006300; }
    .page { fill: #F4F4F1; }
    .cardf { fill: #FCFCFB; }
    .glass { fill: #FFFFFF; fill-opacity: 0.86; stroke: #E1E0D9; }
    .sel { fill: #0B0B0B; fill-opacity: 0.07; }
    .ph { fill: #0B0B0B; fill-opacity: 0.13; }
    .ph-up { fill: #006300; fill-opacity: 0.22; }
    .tog { fill: #E3E3E0; }
    .knob { fill: #FFFFFF; }
    .bezel { fill: #1D1D1F; }
    .island { fill: #000000; }
    .s-ink { stroke: #0B0B0B; }
    .s-sec { stroke: #52514E; }
    .s-mut { stroke: #898781; }
    .s-acc { stroke: #2A78D6; }
    .s-deep { stroke: #174E94; }
    .s-grid { stroke: #E1E0D9; }
    .s-border { stroke: #E1E0D9; }
    .s-zero { stroke: #898781; stroke-opacity: 0.6; }
    .sw-blue { fill: #2A78D6; }
    .sw-aqua { fill: #199E70; }
    .sw-green { fill: #008300; }
    .sw-red { fill: #E34948; }
    .fa-blue { fill: #2A78D6; fill-opacity: 0.16; }
    .fa-aqua { fill: #1BAF7A; fill-opacity: 0.18; }
    .fa-green { fill: #008300; fill-opacity: 0.14; }
    .fa-red { fill: #E34948; fill-opacity: 0.14; }
    .ln-blue { stroke: #2A78D6; }
    .ln-aqua { stroke: #199E70; }
    .ln-green { stroke: #008300; }
    .ln-red { stroke: #E34948; }
  </style>

  <defs>
    <filter id="shadow" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
    <clipPath id="screen">
      <rect width="402" height="874" rx="55"/>
    </clipPath>

    <!-- Symbols, each centered on 0,0 -->
    <path id="chev" d="M-2.5 -5 L2.5 0 L-2.5 5" fill="none" class="s-mut" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <g id="clock">
      <circle r="6" fill="none" class="s-sec" stroke-width="1.5"/>
      <path d="M0 -3.4 V0 H2.6" fill="none" class="s-sec" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="info">
      <circle r="8.5" fill="none" class="s-acc" stroke-width="1.5"/>
      <circle cy="-3.9" r="1.15" class="acc"/>
      <rect x="-0.85" y="-1.3" width="1.7" height="6.6" rx="0.85" class="acc"/>
    </g>
    <g id="eye">
      <path d="M-11 0 C-7.5 -7 7.5 -7 11 0 C7.5 7 -7.5 7 -11 0 Z" fill="none" class="s-ink" stroke-width="1.7" stroke-linejoin="round"/>
      <circle r="3.4" class="ink"/>
    </g>
    <g id="eyeslash">
      <use href="#eye"/>
      <path d="M-9.5 -9 L9.5 9" fill="none" class="s-ink" stroke-width="1.8" stroke-linecap="round"/>
    </g>
    <g id="gear">
      <circle r="8.8" fill="none" class="s-ink" stroke-width="3.2" stroke-dasharray="3.45 3.4615"/>
      <circle r="6.8" fill="none" class="s-ink" stroke-width="2.4"/>
      <circle r="2.4" fill="none" class="s-ink" stroke-width="1.6"/>
    </g>
    <g id="toggle">
      <rect width="51" height="31" rx="15.5" class="tog"/>
      <circle cx="15.5" cy="15.5" r="13.5" class="knob" filter="url(#shadow)"/>
    </g>

    <!-- Phone chrome -->
    <rect id="bezel" x="-8" y="-8" width="418" height="890" rx="63" class="bezel"/>
    <g id="statusbar">
      <text x="54" y="37" class="hd ink">9:41</text>
      <rect x="138.5" y="11" width="125" height="37" rx="18.5" class="island"/>
      <rect x="298" y="30" width="3" height="5" rx="1" class="ink"/>
      <rect x="303" y="27.5" width="3" height="7.5" rx="1" class="ink"/>
      <rect x="308" y="25" width="3" height="10" rx="1" class="ink"/>
      <rect x="313" y="22.5" width="3" height="12.5" rx="1" class="ink"/>
      <path d="M326.4 27.9 A10 10 0 0 1 340.6 27.9 M328.9 30.4 A6.5 6.5 0 0 1 338.1 30.4" fill="none" class="s-ink" stroke-width="2" stroke-linecap="round"/>
      <circle cx="333.5" cy="33.6" r="1.7" class="ink"/>
      <rect x="350.5" y="23.5" width="25" height="12" rx="3.5" fill="none" class="s-ink" stroke-opacity="0.4"/>
      <rect x="352.5" y="25.5" width="21" height="8" rx="2" class="ink"/>
      <rect x="377" y="27.5" width="1.6" height="4" rx="0.8" class="ink" fill-opacity="0.4"/>
    </g>
    <g id="navbar">
      <rect x="294" y="56" width="92" height="44" rx="22" class="glass" filter="url(#shadow)"/>
      <use href="#gear" x="362" y="78"/>
      <text x="16" y="140" class="lt ink">Overview</text>
    </g>
    <g id="tabbar">
      <rect x="20" y="788" width="362" height="64" rx="32" class="glass" filter="url(#shadow)"/>
      <rect x="26" y="794" width="118" height="52" rx="26" class="sel"/>
      <circle cx="85" cy="812" r="9.5" fill="none" class="s-acc" stroke-width="2"/>
      <circle cx="85" cy="812" r="4.2" class="acc"/>
      <text x="85" y="838" class="tab acc mid">Overview</text>
      <rect x="191" y="803.5" width="20" height="17" rx="3.5" fill="none" class="s-ink" stroke-width="1.8"/>
      <path d="M195 809.5 H207 M195 814.5 H207" fill="none" class="s-ink" stroke-width="1.8" stroke-linecap="round"/>
      <text x="201" y="838" class="tab ink mid">Accounts</text>
      <circle cx="317" cy="812" r="9.5" fill="none" class="s-ink" stroke-width="1.8"/>
      <path d="M317 812 V805.5 A6.5 6.5 0 0 1 323.5 812 Z" class="ink"/>
      <text x="317" y="838" class="tab ink mid">Plan</text>
      <rect x="134" y="860" width="134" height="5" rx="2.5" class="ink"/>
    </g>

    <!-- Tiles' contents, from the tile's top left corner -->
    <g id="nw">
      <text x="12" y="27" class="sh sec">Net worth</text>
      <text x="12" y="61" class="ti ink">312.480 €</text>
      <text x="12" y="85" class="sh up">▲ 4.210 €</text>
      <text x="12" y="107" class="sh sec">in September</text>
      <text x="12" y="129" class="sh"><tspan class="up">▲ 6,2%</tspan><tspan class="sec"> this year</tspan></text>
    </g>
    <g id="nw-hidden">
      <text x="12" y="27" class="sh sec">Net worth</text>
      <rect x="12" y="38" width="124" height="28" rx="7" class="ph"/>
      <text x="12" y="85" class="sh up">▲</text>
      <rect x="29" y="73" width="58" height="16" rx="5" class="ph-up"/>
      <text x="12" y="107" class="sh sec">in September</text>
      <text x="12" y="129" class="sh"><tspan class="up">▲ 6,2%</tspan><tspan class="sec"> this year</tspan></text>
    </g>
    <g id="ot-head">
      <text x="12" y="27" class="sh sec">On track?</text>
      <use href="#chev" x="164" y="22"/>
      <text x="12" y="61" class="ti up">On plan</text>
    </g>
    <g id="ot">
      <use href="#ot-head"/>
      <text x="12" y="85" class="sh ink">12.400 € ahead</text>
      <text x="12" y="107" class="sh sec">of January</text>
    </g>
    <g id="ot-hidden">
      <use href="#ot-head"/>
      <rect x="12" y="73" width="64" height="16" rx="5" class="ph"/>
      <text x="82" y="85" class="sh ink">ahead</text>
      <text x="12" y="107" class="sh sec">of January</text>
    </g>
    <g id="coast">
      <text x="12" y="129" class="sh ink">Past the coast point:</text>
      <text x="12" y="151" class="sh ink">63 without saving</text>
    </g>

    <!-- Under the header: the chart's controls, legend and chart, from the controls' top -->
    <g id="below">
      <text x="16" y="18" class="sh sb acc">3Y</text>
      <path d="M39 9.5 L43 13.5 L47 9.5" fill="none" class="s-acc" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="326" y="18" class="sh ink end">Future</text>
      <use href="#toggle" x="335" y="-3"/>
      <rect x="16" y="42" width="12" height="4" rx="2" class="sw-blue"/>
      <text x="33" y="48" class="lg sec">Cash</text>
      <rect x="76" y="42" width="12" height="4" rx="2" class="sw-aqua"/>
      <text x="93" y="48" class="lg sec">Equity</text>
      <rect x="146" y="42" width="12" height="4" rx="2" class="sw-green"/>
      <text x="163" y="48" class="lg sec">Real estate</text>
      <rect x="244" y="42" width="12" height="4" rx="2" class="sw-red"/>
      <text x="261" y="48" class="lg sec">Debts</text>
      <path d="M16 90.5 H386 M16 145.5 H386" fill="none" class="s-grid" stroke-width="0.5"/>
      <path d="M16,200 L16,180 L53,179 L90,180 L127,178 L164,177 L201,176 L238,175 L275,174 L312,174 L349,173 L386,172 L386,200 Z" class="fa-blue"/>
      <path d="M16,180 L53,179 L90,180 L127,178 L164,177 L201,176 L238,175 L275,174 L312,174 L349,173 L386,172" fill="none" class="ln-blue" stroke-width="2" stroke-linejoin="round"/>
      <path d="M16,178 L53,177 L90,178 L127,176 L164,175 L201,174 L238,173 L275,172 L312,172 L349,171 L386,170 L386,104 L349,110 L312,114 L275,120 L238,128 L201,130 L164,136 L127,140 L90,148 L53,146 L16,150 Z" class="fa-aqua"/>
      <path d="M16,150 L53,146 L90,148 L127,140 L164,136 L201,130 L238,128 L275,120 L312,114 L349,110 L386,104" fill="none" class="ln-aqua" stroke-width="2" stroke-linejoin="round"/>
      <path d="M16,148 L53,144 L90,146 L127,138 L164,134 L201,128 L238,126 L275,118 L312,112 L349,108 L386,102 L386,78 L349,84 L312,88 L275,94 L238,102 L201,104 L164,110 L127,114 L90,122 L53,120 L16,124 Z" class="fa-green"/>
      <path d="M16,124 L53,120 L90,122 L127,114 L164,110 L201,104 L238,102 L275,94 L312,88 L349,84 L386,78" fill="none" class="ln-green" stroke-width="2" stroke-linejoin="round"/>
      <path d="M16,202 L386,202 L386,217 L349,218 L312,218 L275,219 L238,219 L201,220 L164,220 L127,221 L90,221 L53,222 L16,222 Z" class="fa-red"/>
      <path d="M16,222 L53,222 L90,221 L127,221 L164,220 L201,220 L238,219 L275,219 L312,218 L349,218 L386,217" fill="none" class="ln-red" stroke-width="2" stroke-linejoin="round"/>
      <path d="M16 201 H386" fill="none" class="s-zero" stroke-width="1"/>
    </g>

    <!-- The run status line under the ring: "◷ 30 Sep  ⓘ", centered, from its baseline -->
    <g id="status">
      <use href="#clock" x="162" y="-5"/>
      <text x="173" y="0" class="sh sec">30 Sep</text>
      <use href="#info" x="236" y="-5"/>
    </g>
  </defs>

  <rect width="1430" height="1110" class="sheet"/>
  <text x="56" y="62" class="ink" style="font-size: 30px; font-weight: 700;">Sketch B: the ring with the answer</text>
  <text x="56" y="92" class="sec" style="font-size: 17px;">iPhone, light mode. The headline sits inside a ring 200 points across, which fills with the readiness. Made-up values from UI.md.</text>

  <!-- 1. Not yet, 58% -->
  <g transform="translate(56 120)">
    <use href="#bezel"/>
    <g clip-path="url(#screen)">
      <rect width="402" height="874" class="page"/>
      <use href="#statusbar"/>
      <use href="#navbar"/>
      <use href="#eye" x="318" y="78"/>

      <text x="201" y="180" class="sh sec mid">Can I retire yet?</text>
      <circle cx="201" cy="292" r="94" fill="none" class="s-grid" stroke-width="12"/>
      <circle cx="201" cy="292" r="94" fill="none" class="s-acc" stroke-width="12" stroke-linecap="round" stroke-dasharray="342.56 1000" transform="rotate(-90 201 292)"/>
      <text x="201" y="289" class="ti ink mid">In 15 years</text>
      <text x="201" y="316" class="sh mid"><tspan class="ink sb">58%</tspan><tspan class="sec"> ready</tspan></text>
      <use href="#status" y="420"/>

      <g transform="translate(16 436)">
        <rect x="0.5" y="0.5" width="178" height="167" rx="15.5" class="cardf s-border"/>
        <use href="#nw"/>
      </g>
      <g transform="translate(207 436)">
        <rect x="0.5" y="0.5" width="178" height="167" rx="15.5" class="cardf s-border"/>
        <use href="#ot"/>
        <use href="#coast"/>
      </g>
      <use href="#below" y="628"/>
      <use href="#tabbar"/>
    </g>
  </g>

  <!-- 2. Yes, lapping at 130% -->
  <g transform="translate(514 120)">
    <use href="#bezel"/>
    <g clip-path="url(#screen)">
      <rect width="402" height="874" class="page"/>
      <use href="#statusbar"/>
      <use href="#navbar"/>
      <use href="#eye" x="318" y="78"/>

      <text x="201" y="180" class="sh sec mid">Can I retire yet?</text>
      <circle cx="201" cy="292" r="94" fill="none" class="s-acc" stroke-width="12"/>
      <circle cx="201" cy="292" r="94" fill="none" class="s-deep" stroke-width="12" stroke-linecap="round" stroke-dasharray="177.19 1000" transform="rotate(-90 201 292)"/>
      <text x="201" y="289" class="ti ink mid">Yes</text>
      <text x="201" y="316" class="sh mid"><tspan class="ink sb">130%</tspan><tspan class="sec"> ready</tspan></text>
      <use href="#status" y="420"/>

      <g transform="translate(16 436)">
        <rect x="0.5" y="0.5" width="178" height="145" rx="15.5" class="cardf s-border"/>
        <use href="#nw"/>
      </g>
      <g transform="translate(207 436)">
        <rect x="0.5" y="0.5" width="178" height="145" rx="15.5" class="cardf s-border"/>
        <use href="#ot"/>
      </g>
      <use href="#below" y="606"/>
      <use href="#tabbar"/>
    </g>
  </g>

  <!-- 3. Hidden amounts, 58%+ -->
  <g transform="translate(972 120)">
    <use href="#bezel"/>
    <g clip-path="url(#screen)">
      <rect width="402" height="874" class="page"/>
      <use href="#statusbar"/>
      <use href="#navbar"/>
      <use href="#eyeslash" x="318" y="78"/>

      <text x="201" y="180" class="sh sec mid">Can I retire yet?</text>
      <circle cx="201" cy="292" r="94" fill="none" class="s-grid" stroke-width="12"/>
      <circle cx="201" cy="292" r="94" fill="none" class="s-acc" stroke-width="12" stroke-linecap="round" stroke-dasharray="342.56 1000" transform="rotate(-90 201 292)"/>
      <text x="201" y="289" class="ti ink mid">In 15 years</text>
      <text x="201" y="316" class="sh mid"><tspan class="ink sb">58%+</tspan><tspan class="sec"> ready</tspan></text>
      <use href="#status" y="420"/>

      <g transform="translate(16 436)">
        <rect x="0.5" y="0.5" width="178" height="167" rx="15.5" class="cardf s-border"/>
        <use href="#nw-hidden"/>
      </g>
      <g transform="translate(207 436)">
        <rect x="0.5" y="0.5" width="178" height="167" rx="15.5" class="cardf s-border"/>
        <use href="#ot-hidden"/>
        <use href="#coast"/>
      </g>
      <use href="#below" y="628"/>
      <use href="#tabbar"/>
    </g>
  </g>

  <!-- Captions -->
  <text x="56" y="1036" class="hd ink">Not yet · 58% ready</text>
  <text x="56" y="1060" class="sh sec">The words say when; the fill says how close.</text>
  <text x="56" y="1080" class="sh sec">The ring and the headline open the plan.</text>

  <text x="514" y="1036" class="hd ink">Yes · 130% ready</text>
  <text x="514" y="1060" class="sh sec">Past 100% the ring laps itself in the deeper</text>
  <text x="514" y="1080" class="sh sec">blue. No coast point line with “Yes”.</text>

  <text x="972" y="1036" class="hd ink">Hidden amounts · 58%+ ready</text>
  <text x="972" y="1060" class="sh sec">The eye hides the tiles’ amounts; the headline</text>
  <text x="972" y="1080" class="sh sec">and the ring have none, so they stay.</text>
</svg>
