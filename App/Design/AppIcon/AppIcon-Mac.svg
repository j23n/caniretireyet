  <path d="M0 790 L 150 735 L 270 765 L 420 650 L 545 700 L 700 560 L 830 600 L 1024 430" fill="none" stroke="#9ec5f4" stroke-width="18" stroke-linejoin="round" stroke-linecap="round"/>
