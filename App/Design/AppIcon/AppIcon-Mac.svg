  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185.4" fill="#0f2a55" filter="url(#shadow)"/>
  <g clip-path="url(#squircle)"><g transform="translate(100 100) scale(0.8046875)">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f2a55"/><stop offset="0.55" stop-color="#2a63b8"/><stop offset="0.82" stop-color="#f1b75c"/>
