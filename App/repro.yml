# TEMPORARY: the Plan screen crash harness (App/Repro), built and run by
# .github/workflows/repro.yml. Not part of the app.
name: PlanRepro

options:
  bundleIdPrefix: com.example
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: ""

packages:
  CanIRetireYetKit:
    path: ..

targets:
  PlanRepro:
    type: application
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Sources
        excludes:
          - App/CanIRetireYetApp.swift
      - path: Shared
      - path: Resources
      - path: Repro
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.planrepro
        PRODUCT_NAME: PlanRepro
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: NO
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: PlanRepro
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    dependencies:
      - package: CanIRetireYetKit
        product: Model
      - package: CanIRetireYetKit
        product: Tracker
      - package: CanIRetireYetKit
        product: Storage
      - package: CanIRetireYetKit
        product: Importer
      - package: CanIRetireYetKit
        product: Prices
      - package: CanIRetireYetKit
        product: Planner
      - package: CanIRetireYetKit
        product: CloudSync
      - package: CanIRetireYetKit
        product: Glance

schemes:
  PlanRepro:
    build:
      targets:
        PlanRepro: all
    run:
      config: Debug
